name: Laravel CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    name: PHP 8.5 — tests and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      MAIL_MAILER: array
      SESSION_DRIVER: array
      CACHE_STORE: array
      BCRYPT_ROUNDS: '4'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate dependency manifest and lock
        run: composer validate --no-check-publish
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP dependency advisories
        run: composer audit
      - name: Prepare disposable environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan migrate --force
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check frontend dependency advisories
        run: npm audit --audit-level=high
      - name: Build frontend assets
        run: npm run build
      - name: Compile Blade templates
        run: php artisan view:cache
      - name: Run automated tests
        run: php artisan test --log-junit=storage/logs/phpunit.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: phpunit-php-8.5
          path: storage/logs/phpunit.xml
          if-no-files-found: ignore
          retention-days: 7
